<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outils · claude-prime</title>
  <style>
    :root {
      --bg: #f7f5f2;
      --text: #1f1d1a;
      --muted: #6b665e;
      --accent: #c96442;
      --card: #ffffff;
      --border: #e6e1d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1917;
        --text: #f2efe9;
        --muted: #a39d93;
        --accent: #e07b55;
        --card: #24221f;
        --border: #36332e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 720px;
      margin: 40px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
    }
    h1 span { color: var(--accent); }
    p { margin: 0 0 24px; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    li {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
    }
    li strong { display: block; margin-bottom: 4px; }
    li span { color: var(--muted); font-size: 0.95rem; }
    a { color: var(--accent); }
    footer { margin-top: 32px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1><span>Outils</span></h1>
    <p>Liste des outils utilisés dans le projet claude-prime.</p>
    <ul>
      <li>
        <strong>Git</strong>
        <span>Gestion de versions du dépôt.</span>
      </li>
      <li>
        <strong>GitHub</strong>
        <span>Hébergement du dépôt et des branches.</span>
      </li>
      <li>
        <strong>HTML / CSS</strong>
        <span>Structure et mise en forme des pages.</span>
      </li>
    </ul>
    <footer>© <span id="annee">2026</span> claude-prime · <a href="index.html">Accueil</a></footer>
  </main>
  <script>document.getElementById('annee').textContent = new Date().getFullYear();</script>
</body>
</html>
