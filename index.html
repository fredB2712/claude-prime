<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenue sur claude-prime</title>
  <style>
    :root {
      --bg: #f7f5f2;
      --text: #1f1d1a;
      --muted: #6b665e;
      --accent: #c96442;
      --card: #ffffff;
      --border: #e6e1d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1917;
        --text: #f2efe9;
        --muted: #a39d93;
        --accent: #e07b55;
        --card: #24221f;
        --border: #36332e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
    }
    h1 span { color: var(--accent); }
    p { margin: 0 0 24px; color: var(--muted); }
    .bouton {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .bouton:hover { opacity: 0.9; }
    footer { margin-top: 32px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Bienvenue sur <span>claude-prime</span></h1>
    <p>Ravi de vous voir ici ! Cette page est le point de départ du projet. Explorez le dépôt pour découvrir ce qui s'y construit.</p>
    <a class="bouton" href="https://github.com/fredB2712/claude-prime">Voir le dépôt</a>
    <footer>© <span id="annee">2026</span> claude-prime</footer>
  </main>
  <script>document.getElementById('annee').textContent = new Date().getFullYear();</script>
</body>
</html>
